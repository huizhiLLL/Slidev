<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>huizhi's Slidev</title>
    <meta name="color-scheme" content="light">
    <style>
      @font-face {
        font-family: MiSans;
        src: url('/llcv/fonts/misans-regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fff;
        color: #202124;
        font-family: MiSans, 'PingFang SC', 'SF Pro Text', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(1080px, calc(100% - 96px));
        margin: 0 auto;
        padding: 128px 0 96px;
      }
      h1 {
        margin: 0 0 72px;
        font: 400 clamp(44px, 6vw, 64px)/1.15 Georgia, 'Times New Roman', serif;
        letter-spacing: -0.025em;
      }
      .projects {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 48px 32px;
      }
      .project {
        display: block;
        min-width: 0;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
      }
      .project:focus-visible { outline: 2px solid #285eb5; outline-offset: 8px; }
      .project:active { transform: translateY(1px); }
      .thumbnail {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #f7f8f9;
        outline: 1px solid #d9dde1;
        outline-offset: -1px;
      }
      iframe {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
      }
      h2 { margin: 20px 0 8px; font-size: 19px; font-weight: 400; line-height: 1.65; }
      time { color: #62676d; font-size: 14px; font-variant-numeric: tabular-nums; }
      @media (hover: hover) {
        .project:hover h2 { text-decoration: underline; text-underline-offset: 5px; }
      }
      @media (max-width: 600px) {
        main { width: calc(100% - 48px); padding-top: 72px; }
        h1 { margin-bottom: 48px; }
        .projects { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 lang="en">huizhi's Slidev</h1>
      <div class="projects">
        <a class="project" href="/llcv/" aria-labelledby="llcv-title">
          <div class="thumbnail" aria-hidden="true" inert>
            <iframe src="/llcv/1?embedded=true&amp;thumbnail=true" title="魔方视觉识别汇报首页预览" tabindex="-1" loading="lazy"></iframe>
          </div>
          <h2 id="llcv-title">魔方视觉识别 SITP 立项汇报</h2>
          <time datetime="2026-11-04">2026-11-04</time>
        </a>
      </div>
    </main>
  </body>
</html>
